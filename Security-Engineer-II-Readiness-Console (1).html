    {q:"Explain SQL injection and its fix to a non-technical manager.",lvl:"core",pts:["Analogy: the app pastes user input straight into a database instruction, so input can change the instruction","Impact in business terms: read the whole customer table, delete data, sometimes take over the server","Fix: parameterized queries — the database is told what's instruction and what's data, separately","Supporting layers: input validation, least-privilege database account, WAF","Note it's still on the OWASP Top 10 after 20 years because it's easy to reintroduce","Keep it plain — no jargon, no code, check they followed"]}
  ]
},
{
  id:"ir", n:13, title:"Incident Response", pri:4,
  blurb:"The six phases, and what you actually do in each.",
  lede:"Even if you're not on the IR team, you'll be pulled into incidents as the person who understands the cloud environment. Interviewers want to see structured thinking under pressure and the judgment to know that containment beats curiosity.",
  onjob:"We provide cloud context during incidents: what that resource is, who owns it, what identity it runs as, and what it could reach. We also feed lessons learned back into detections and policy.",
  points:[
    "Preparation — plans, runbooks, contacts, tooling, log coverage, and practice. The phase that determines how the other five go.",
    "Detection & Analysis — validate it's real, determine scope and severity, and start the timeline immediately.",
    "Containment — stop the spread. Short-term (isolate, disable, revoke tokens) then longer-term stabilization while you investigate.",
    "Eradication — remove the root cause: malware, persistence mechanisms, backdoored accounts, the vulnerability that let them in.",
    "Recovery — restore to known-good, verify integrity, and monitor closely for recurrence.",
    "Lessons Learned — blameless post-incident review producing concrete, owned action items with dates.",
    "In cloud, containment often means revoking tokens and disabling identities, not unplugging a machine. Snapshot before you destroy.",
    "Communication is a workstream of its own: technical responders, leadership, legal, and possibly regulators have different needs and cadences."
  ],
  terms:[
    {t:"IR plan",d:"The documented procedure for handling security incidents."},
    {t:"Containment",d:"Limiting an incident's spread and impact before eradicating it."},
    {t:"Eradication",d:"Removing the attacker and the root cause from the environment."},
    {t:"IOC",d:"Indicator of Compromise — an artifact suggesting a breach (IP, hash, domain)."},
    {t:"Chain of custody",d:"Documented handling of evidence to keep it defensible."},
    {t:"Blast radius",d:"The scope of what a compromised resource or identity could reach."},
    {t:"Post-incident review",d:"Blameless analysis producing improvement actions."},
    {t:"MTTD / MTTR",d:"Mean time to detect / mean time to respond — the core IR metrics."}
  ],
  study:[
    {q:"List the six IR phases in order.",a:"Preparation, Detection & Analysis, Containment, Eradication, Recovery, and Lessons Learned."},
    {q:"Why is preparation the most important phase?",a:"Everything else depends on it. Whether you have logs, a plan, contact lists, tested runbooks, and permission to act determines whether the incident is a two-hour containment or a two-week investigation with missing evidence."},
    {q:"What does containment look like for a compromised cloud identity?",a:"Revoke active sessions and refresh tokens, disable the account or rotate the credential, remove elevated role assignments, and review what it did while compromised. Simply changing the password isn't enough — existing tokens stay valid until revoked."},
    {q:"Why should the post-incident review be blameless?",a:"If people expect punishment they hide information, and you lose the detail needed to fix the system. Incidents almost always trace to process and design gaps rather than one person's mistake. Blameless reviews get you the truth and therefore the fix."}
  ],
  iq:[
    {q:"An EC2 instance or VM is confirmed compromised. Walk me through your response.",lvl:"scenario",pts:["Confirm the finding is real before disrupting production","Preserve evidence: snapshot the disk and capture memory if possible, before changing anything","Contain: isolate with a restrictive security group rather than terminating, so you keep the evidence","Revoke the instance's identity credentials and rotate anything it had access to","Scope it: what did that identity touch, what else did that IP reach, is it lateral yet","Eradicate and rebuild from a known-good image — don't clean and return to service","Recover, then monitor for return","Post-incident review: how did it get in, why didn't we detect it sooner, what changes"]},
    {q:"How do you decide incident severity?",lvl:"deep",pts:["Data sensitivity and volume involved","Systems affected and whether they're business-critical","Whether it's active and spreading or contained","Regulatory or contractual notification triggers","Reputational and customer impact","Use a predefined severity matrix so it's consistent, not a judgment call at 3am","Err upward initially — it's easier to downgrade than to explain a late escalation"]}
  ]
},
{
  id:"comms", n:14, title:"Vendor Engagement & Communication", pri:4,
  blurb:"Explaining findings, pushing vendors, and getting other teams to actually act.",
  lede:"Security engineers can't fix most of what they find — someone else owns the system. That makes influence the core skill. This is also the section that separates a Security Engineer II from a Security Engineer I: you're expected to hold the vendor call and the developer conversation without a manager in the room.",
  onjob:"We run vendor syncs with the CNAPP and scanner providers, escalate broken detections, explain findings to developers who didn't ask for them, and translate technical risk into something leadership can decide on.",
  points:[
    "Adapt to the audience. Developers want the exploit path and the fix. Leadership wants risk, cost, and a decision. Auditors want evidence.",
    "Lead with impact, not with the tool's policy name. 'Anyone on the internet can read these customer records' beats 'Policy CKV_AZURE_59 failed'.",
    "Bring the fix. A finding with a suggested remediation gets acted on; a finding alone gets deprioritized.",
    "Assume competence and good intent. Developers aren't careless — they're measured on delivery and nobody handed them the secure pattern.",
    "With vendors: come prepared with specifics — screenshots, IDs, timestamps, reproduction steps. Track issues in writing, hold them to dates, and know your support tier and escalation path.",
    "Ask questions when you don't know something. Pretending is how you lose credibility permanently; asking is how you learn the environment.",
    "Written communication is most of the job: findings, tickets, status updates, runbooks. Clear beats clever.",
    "Escalate with a recommendation, not just a problem."
  ],
  terms:[
    {t:"Stakeholder",d:"Anyone affected by or able to influence the work."},
    {t:"Escalation path",d:"The defined route for raising an unresolved issue to the next level."},
    {t:"SLA",d:"A committed response or resolution time from a vendor or internal team."},
    {t:"Risk acceptance",d:"A documented decision by an accountable owner to live with a known risk."},
    {t:"QBR",d:"Quarterly Business Review — recurring vendor performance and roadmap meeting."},
    {t:"POC",d:"Proof of Concept — a scoped trial to validate a tool before purchase."}
  ],
  study:[
    {q:"How do you explain a finding to a developer so they act on it?",a:"Show what an attacker could actually do with it, in their system's terms. Point to the exact line, resource, or config. Provide the fixed version. Give a realistic timeline and offer to help. Skip the policy ID and the lecture."},
    {q:"How does a report to leadership differ from one to engineers?",a:"Leadership needs the business impact, the options with cost and effort, a recommendation, and a decision to make. No tool names, no CVE numbers, no packet detail. Engineers need the technical specifics and the fix."},
    {q:"What do you bring to a vendor escalation call?",a:"Concrete evidence — case numbers, timestamps, screenshots, reproduction steps — plus a clear statement of business impact, what you've already tried, and what you're asking them to commit to by when. Then follow up in writing."},
    {q:"You're asked about a technology you don't know in an interview. What do you say?",a:"Say you haven't worked with it, then reason out loud from principles you do know and draw the analogy to something similar. Interviewers are testing how you handle gaps — honest reasoning scores far higher than a confident wrong answer."}
  ],
  iq:[
    {q:"A team pushes back hard on a critical finding. How do you handle it?",lvl:"scenario",pts:["Listen first — they may have context that changes the assessment","Verify your own finding before defending it","Separate the two possible disagreements: is it not real, or is it not a priority","If it's real, demonstrate the impact concretely rather than asserting severity","Offer options: full fix, compensating control, or phased approach","Understand their constraints and work within them where you can","If it stays unresolved, escalate to the accountable owner with a clear recommendation and let them formally accept the risk","Keep the relationship — you'll need them next quarter"]},
    {q:"How would you present the security posture of our cloud environment to executives?",lvl:"scenario",pts:["Open with the answer: are we better or worse than last quarter, and what needs a decision","Use trend lines and risk reduction, not raw finding counts","Frame in business terms: exposure of customer data, regulatory risk, operational risk","Include coverage honestly — what we can't see is as important as what we found","Bring two or three specific asks with cost and benefit","Keep it short with detail in an appendix","Never surprise them — significant issues get raised before the deck"]}
  ]

const MEM = {};
const store = {
  read(){
    try{ const r = localStorage.getItem("secprep.v1"); if(r) return JSON.parse(r); }catch(e){}
    return MEM.data || null;
  },
  write(o){
    MEM.data = o;
    try{ localStorage.setItem("secprep.v1", JSON.stringify(o)); }catch(e){}
  },
  clear(){ MEM.data = null; try{ localStorage.removeItem("secprep.v1"); }catch(e){} }
};
const blank = () => ({read:{}, study:{}, iq:{}, cards:{}, plan:{}, theme:"light"});
let S = Object.assign(blank(), store.read() || {});
const save = () => store.write(S);

const T = id => TOPICS.find(t=>t.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* readiness maths */
function topicScore(t){
  const sq = t.study.length, iqn = t.iq.length;
  const sDone = t.study.filter((_,i)=>S.study[t.id+":"+i]!=null).length;
  const sGood = t.study.filter((_,i)=>(S.study[t.id+":"+i]||0)>=2).length;
  const iDone = t.iq.filter((_,i)=>S.iq[t.id+":"+i]!=null).length;
  const iGood = t.iq.filter((_,i)=>(S.iq[t.id+":"+i]||0)>=2).length;
  const readPart = S.read[t.id] ? 25 : 0;
  const studyPart = sq ? 40*(sGood/sq) : 40;
  const iqPart = iqn ? 35*(iGood/iqn) : 35;
  return {
    pct: Math.round(readPart+studyPart+iqPart),
    sDone, sq, iDone, iqn, sGood, iGood,
    touched: !!S.read[t.id] || sDone>0 || iDone>0
  };
}
function readiness(){
  let wsum=0, w=0;
  TOPICS.forEach(t=>{ const wt = t.pri; wsum += topicScore(t).pct*wt; w += wt; });
  return Math.round(wsum/w);
}
const BANDS = [
  {min:0,  label:"Not started",     v:"--crit"},
  {min:1,  label:"Critical gaps",   v:"--crit"},
  {min:25, label:"Major gaps",      v:"--high"},
  {min:45, label:"Coming together", v:"--med"},
  {min:65, label:"Solid coverage",  v:"--low"},
  {min:85, label:"Interview-ready", v:"--brand"}
];
const band = p => BANDS.filter(b=>p>=b.min).pop();

/* ============================================================
   POSTURE HEADER (signature element)
   ============================================================ */
function renderPosture(){
  const p = readiness(), b = band(p), C = 2*Math.PI*23;
  const done = TOPICS.filter(t=>topicScore(t).pct>=80).length;
  const q = Object.keys(S.study).length + Object.keys(S.iq).length;
  const weak = TOPICS.filter(t=>t.pri===5 && topicScore(t).pct<60).length;
  document.getElementById("posture").innerHTML = `
    <div class="ring" style="--score:var(${b.v})">
      <svg width="52" height="52"><circle class="track" cx="26" cy="26" r="23"></circle>
      <circle class="fill" cx="26" cy="26" r="23" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"></circle></svg>
      <b>${p}</b>
    </div>
    <div class="posture-meta" style="--score:var(${b.v})">
      <div class="lbl">Readiness posture</div>
      <div class="val">${b.label}</div>
    </div>
    <div class="posture-stats">
      <div class="pstat"><div class="n">${done}<span style="color:var(--muted)">/${TOPICS.length}</span></div><div class="t">Topics solid</div></div>
      <div class="pstat"><div class="n">${q}</div><div class="t">Questions rated</div></div>
      <div class="pstat"><div class="n" style="color:${weak?"var(--crit)":"var(--low)"}">${weak}</div><div class="t">Top-priority gaps</div></div>
    </div>`;
}

    :`<div class="answer">

        <ul class="pts">${q.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
        <div class="mini-h" style="margin-top:20px">How did that go?</div>
        <div class="selfrate">
          <button class="rate" data-srate="0">Shaky</button>
          <button class="rate" data-srate="1">Got the gist</button>
          <button class="rate" data-srate="2">Solid</button>
        </div>
      </div>`}
  </div>`;
};

/* ---------- flashcards ---------- */
let deck = null;
V.cards = () => {
  if(!deck){
    const total = TOPICS.reduce((a,t)=>a+t.terms.length,0);
    const known = Object.values(S.cards).filter(Boolean).length;
    return `
    <div class="eyebrow">Rehearse</div>
    <h1 class="h-page">Flashcards</h1>
    <p class="sub">${total} terms pulled from every topic. The fastest way to stop the vocabulary being the thing that
    slows you down — you can't reason about CIEM in an interview while also trying to remember what it stands for.</p>
    <div class="card" style="padding:20px;margin-top:22px">
      <div class="mini-h" style="margin-top:0">Deck</div>
      <div class="chiprow">
        <button class="chip" data-deck="all" aria-pressed="true">All ${total} terms</button>
        <button class="chip" data-deck="unknown">Only the ${total-known} not yet marked known</button>
        <button class="chip" data-deck="p5">Five-star topics only</button>
      </div>
      <p class="note">Progress: ${known} of ${total} marked known.</p>
    </div>`;
  }
  if(deck.i>=deck.list.length) return `
    <div class="eyebrow">Flashcards</div>
    <h1 class="h-page">Deck finished</h1>
    <div class="stage" style="margin-top:20px">
      <p class="lede" style="margin-top:0">You marked <b>${deck.known}</b> of ${deck.list.length} as known this pass.</p>
      <div class="btnrow" style="margin-top:22px">
        <button class="btn" data-deck-exit="1">Choose another deck</button>
        <button class="btn ghost" data-view-go="acronyms">See all terms as a list</button>
      </div>
    </div>`;
  const c = deck.list[deck.i];
  return `
  <div class="eyebrow">Flashcards · ${esc(c.topic)}</div>
  <div class="progline"><i style="width:${Math.round(100*deck.i/deck.list.length)}%"></i></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
    <span class="qcount">Card ${deck.i+1} of ${deck.list.length}</span>
    <button class="btn ghost sm" data-deck-exit="1">End deck</button>
  </div>
  <div class="flip ${deck.flipped?"on":""}" id="flip">
    <div class="flip-in">
      <div class="face"><span class="lbl">Term</span><span class="t">${esc(c.t)}</span><span class="lbl" style="margin-top:12px">tap to flip</span></div>
      <div class="face back"><span class="lbl">${esc(c.t)}</span><span class="d">${esc(c.d)}</span></div>
    </div>
  </div>
  <div class="btnrow" style="justify-content:center;margin-top:22px">
    <button class="btn ghost" data-card="0">Review again</button>
    <button class="btn" data-card="1">I know this</button>
  </div>`;
};

/* ---------- acronym decoder ---------- */
let filter = "";
V.acronyms = () => {
  const rows = [];
  TOPICS.forEach(t=>t.terms.forEach(x=>rows.push({...x,topic:t.title,id:t.id})));
  const f = filter.toLowerCase();
  const shown = rows.filter(r=>!f || r.t.toLowerCase().includes(f) || r.d.toLowerCase().includes(f) || r.topic.toLowerCase().includes(f));
  return `
  <div class="eyebrow">Reference</div>
  <h1 class="h-page">Acronym decoder</h1>
  <p class="sub">Every term from every topic in one searchable list. This field runs on acronyms and most of them
  sound alike — this is the page to keep open during a call.</p>
  <div style="margin:20px 0 14px"><input class="search" id="q" placeholder="Search terms, definitions or topics…" value="${esc(filter)}"></div>
  <div class="card" style="overflow:hidden">
    <table class="tbl"><thead><tr><th style="width:22%">Term</th><th>Meaning</th><th style="width:22%">Topic</th></tr></thead>
    <tbody>${shown.length?shown.map(r=>`<tr><td><code>${esc(r.t)}</code></td><td>${esc(r.d)}</td><td style="color:var(--muted)">${esc(r.topic)}</td></tr>`).join(""):
      `<tr><td colspan="3" class="empty">No term matches that. Try a shorter search.</td></tr>`}</tbody></table>
  </div>
  <p class="note">${shown.length} of ${rows.length} terms shown.</p>`;
};

/* ---------- 4 week plan ---------- */
const PLAN = [
  {w:"Week 1", h:"Ground floor", why:"Nothing else makes sense without the cloud and identity layer underneath it.",
   tasks:["Read Cloud Fundamentals and Identity & Access Management end to end","Run the guided study for both topics until every recall question is solid","Create a free Azure account and deploy one VM plus one storage account by hand","Find and fix a public-access setting on that storage account","Flashcards: cloud and IAM terms only","Practice the IAM interview questions out loud"]},
  {w:"Week 2", h:"Code and pipelines", why:"IaC and CI/CD are where this team's daily work actually happens.",
   tasks:["Read Infrastructure as Code, CI/CD Security and DevSecOps Tooling","Write a small Terraform file that deploys the same storage account","Run Checkov against it, read every finding, fix them in the code","Push it to GitHub and add a scanning step in GitHub Actions","Commit a fake secret deliberately and watch secret scanning catch it","Practice the DevSecOps interview questions — you must be able to define SAST, DAST and SCA without hesitating"]},
  {w:"Week 3", h:"Detection and defect", why:"Findings and logs are the raw material of the role — this is triage week.",
   tasks:["Read CNAPP, Vulnerability Management, SIEM and Containers & Kubernetes","Sign up for a free Wiz or Prisma Cloud trial and connect the test subscription","Look up one real CVE and trace how you'd assess it in your environment","Build and scan a container image; switch the base image and compare the results","Try Splunk free and write one search that groups failed logins by user","Practice the CNAPP and vulnerability management scenario questions"]},
  {w:"Week 4", h:"Rehearsal", why:"Knowing it and being able to say it under pressure are different skills.",
   tasks:["Read the remaining topics: best practices, incident response, communication, project management","Write out five STAR stories in full, then cut each to 90 seconds","Run a full mock interview in this app and rate yourself honestly","Redo every question you rated shaky","Prepare four questions to ask the interviewer","Do one last flashcard pass over all terms","Write a one-paragraph answer to 'why cloud security' and say it out loud until it sounds like you"]}
];
V.plan = () => {
  const total = PLAN.reduce((a,w)=>a+w.tasks.length,0);
  const done = Object.values(S.plan).filter(Boolean).length;
  return `
  <div class="eyebrow">Prepare</div>
  <h1 class="h-page">Four weeks, start to interview</h1>
  <p class="sub">Built around the priority order in the guide: the five-star topics come first and get the most time,
  and every week pairs reading with something hands-on. If there's less than four weeks, do week 1 and week 4 properly
  and compress the middle.</p>
  <div class="progline" style="margin:20px 0 6px"><i style="width:${Math.round(100*done/total)}%"></i></div>
  <p class="note" style="margin:0 0 20px">${done} of ${total} tasks done</p>
  <div class="grid grid-2">${PLAN.map((w,wi)=>`
    <div class="card week">
      <div class="wlbl">${w.w}</div>
      <h4>${esc(w.h)}</h4>
      <p class="note" style="margin:0 0 10px">${esc(w.why)}</p>
      ${w.tasks.map((t,ti)=>{
        const k = wi+":"+ti, on = !!S.plan[k];
        return `<label class="task ${on?"done":""}"><input type="checkbox" data-plan="${k}" ${on?"checked":""}><span>${esc(t)}</span></label>`;
      }).join("")}
    </div>`).join("")}</div>`;
};

/* ============================================================
   ROUTER + EVENTS
   ============================================================ */
let view = "overview";
function render(){
  document.querySelectorAll(".navbtn").forEach(b=>b.setAttribute("aria-current", b.dataset.view===view));
  document.getElementById("view").innerHTML = V[view]();
  renderPosture();
  const q = document.getElementById("q");
  if(q){ q.addEventListener("input", e=>{ filter=e.target.value; const p=e.target.selectionStart;
    render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(p,p); }); }
  const fl = document.getElementById("flip");
  if(fl) fl.addEventListener("click", ()=>{ deck.flipped=!deck.flipped; render(); });
}
function go(v){
  // a finished session shouldn't greet you again when you come back to the tab
  if(v!=="drill" && drill && drill.stage==="done") drill=null;
  if(v!=="interview" && sess && sess.stage==="done") sess=null;
  if(v!=="cards" && deck && deck.i>=deck.list.length) deck=null;
  view=v; window.scrollTo({top:0,behavior:"instant"}); render();
}

function startDrill(id){ drill={id, stage:"intro", i:0, shown:false, good:0}; go("drill"); }
function startPractice(ids, count, beh, mock){
  let pool=[];
  const list = ids && ids.length ? ids : TOPICS.map(t=>t.id);
  list.forEach(id=>{ const t=T(id); t.iq.forEach((q,i)=>pool.push({...q, topic:t.title, key:id+":"+i})); });
  if(mock){
    const five = pool.filter(q=>TOPICS.find(t=>t.title===q.topic).pri===5 && q.lvl!=="behavioral");
    const rest = pool.filter(q=>!five.includes(q) && q.lvl!=="behavioral");
    pool = shuffle(five).slice(0,5).concat(shuffle(rest).slice(0,2));
    pool = pool.concat(shuffle(BEHAVIORAL_EXTRA.concat(T("traits").iq.map((q,i)=>({...q,topic:"Behavioral",key:"traits:"+i})))).slice(0,3));
  } else {
    if(!beh) pool = pool.filter(q=>q.lvl!=="behavioral");
    pool = shuffle(pool);
    if(count>0) pool = pool.slice(0,count);
  }
  sess={qs:pool, i:0, shown:false, rated:[], weak:[], mock:!!mock, stage:"run"};
  go("interview");
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildDeck(kind){
  let rows=[];
  TOPICS.forEach(t=>{ if(kind==="p5"&&t.pri!==5) return; t.terms.forEach((x,i)=>rows.push({...x,topic:t.title,key:t.id+":"+i})); });
  if(kind==="unknown") rows = rows.filter(r=>!S.cards[r.key]);
  deck={list:shuffle(rows), i:0, flipped:false, known:0};
  if(!deck.list.length) deck.list=[{t:"Nothing left",d:"Every card in this deck is already marked known. Pick another deck.",topic:"—",key:"x"}];
  go("cards");
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-view],[data-view-go],[data-goto],[data-read],[data-drill],[data-drill-start],[data-drill-show],[data-drill-exit],[data-rate],[data-pick],[data-count],[data-beh],[data-sess],[data-sess-show],[data-sess-exit],[data-srate],[data-practice],[data-deck],[data-deck-exit],[data-card]");
  if(!el) return;
  const d = el.dataset;

  if(d.view){ go(d.view); return; }
  if(d.viewGo){ go(d.viewGo); return; }
  if(d.goto){ go("library"); setTimeout(()=>{ const a=document.getElementById("acc-"+d.goto); if(a){a.open=true; a.scrollIntoView({behavior:"smooth",block:"start"});} },60); return; }
  if(d.read){ S.read[d.read]=!S.read[d.read]; save(); render(); return; }

  if(d.drill){ startDrill(d.drill); return; }
  if(d.drillStart){ drill.stage="run"; drill.i=0; drill.shown=false; drill.good=0; S.read[drill.id]=true; save(); render(); return; }
  if(d.drillShow){ drill.shown=true; render(); return; }
  if(d.drillExit){ drill=null; render(); return; }
  if(d.rate!=null && drill){
    const v=+d.rate, t=T(drill.id);
    S.study[drill.id+":"+drill.i]=v; if(v===2) drill.good++;
    save();
    drill.i++; drill.shown=false;
    if(drill.i>=t.study.length) drill.stage="done";
    render(); return;
  }

  if(d.pick){ pick.topics.has(d.pick)?pick.topics.delete(d.pick):pick.topics.add(d.pick); render(); return; }
  if(d.count!=null){ pick.count=+d.count; render(); return; }
  if(d.beh){ pick.behavioral=!pick.behavioral; render(); return; }
  if(d.sess){ d.sess==="mock"?startPractice(null,0,true,true):startPractice([...pick.topics], pick.count, pick.behavioral, false); return; }
  if(d.practice){ startPractice([d.practice],0,true,false); return; }
  if(d.sessShow){ sess.shown=true; render(); return; }
  if(d.sessExit){ sess=null; render(); return; }
  if(d.srate!=null && sess){
    const v=+d.srate, q=sess.qs[sess.i];
    sess.rated.push(v); if(v<2) sess.weak.push(q.q);
    if(q.key) S.iq[q.key]=v;
    save();
    sess.i++; sess.shown=false;
    if(sess.i>=sess.qs.length) sess.stage="done";
    render(); return;
  }

  if(d.deck){ buildDeck(d.deck); return; }
  if(d.deckExit){ deck=null; render(); return; }
  if(d.card!=null){
    const c=deck.list[deck.i];
    if(d.card==="1"){ S.cards[c.key]=true; deck.known++; save(); }
    deck.i++; deck.flipped=false; render(); return;
  }
});

document.addEventListener("change", e=>{
  if(e.target.dataset.plan!=null){ S.plan[e.target.dataset.plan]=e.target.checked; save(); render(); }
});

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(view==="drill" && drill && drill.stage==="run"){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!drill.shown){drill.shown=true;render();} }
    if(drill.shown && ["1","2","3"].includes(e.key)) document.querySelector(`[data-rate="${+e.key-1}"]`)?.click();
  }
  if(view==="interview" && sess && sess.stage==="run"){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!sess.shown){sess.shown=true;render();} }
    if(sess.shown && ["1","2","3"].includes(e.key)) document.querySelector(`[data-srate="${+e.key-1}"]`)?.click();
  }
  if(view==="cards" && deck && deck.i<deck.list.length && (e.key===" "||e.key==="Enter")){ e.preventDefault(); deck.flipped=!deck.flipped; render(); }
});

/* theme + progress controls */
function applyTheme(){ document.documentElement.setAttribute("data-theme", S.theme||"light"); }
document.getElementById("themeBtn").addEventListener("click", ()=>{ S.theme = S.theme==="dark"?"light":"dark"; save(); applyTheme(); });
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Clear all progress? Ratings, read marks, flashcards and plan checkboxes will be reset.")) return;
  const th=S.theme; store.clear(); S=Object.assign(blank(),{theme:th}); save(); drill=null; sess=null; deck=null; go("overview");
});
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "secprep-progress.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});

applyTheme();
render();
</script>
