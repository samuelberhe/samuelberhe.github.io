<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Security Engineer 2 · Product Security Tools · Readiness Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA;
  --ink:#0F1520; --ink-2:#3A4655; --muted:#6E7A8A;
  --line:#D9DFE6; --line-soft:#E8ECF1;
  --brand:#0E7C86; --brand-deep:#095A62; --brand-wash:#E2F1F2;
  --crit:#C2213F; --high:#D2632A; --med:#B8901A; --low:#2C8A61; --info:#3B6FD0;
  --shadow:0 1px 2px rgba(15,21,32,.05), 0 8px 24px -12px rgba(15,21,32,.18);
  --radius:10px;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
html[data-theme="dark"]{
  --bg:#0C1117; --surface:#141B24; --surface-2:#1A222D;
  --ink:#E7EDF4; --ink-2:#B4C0CE; --muted:#7E8C9D;
  --line:#26313D; --line-soft:#1E2833;
  --brand:#3BC2CD; --brand-deep:#8EE3EA; --brand-wash:#123135;
  --crit:#F2607C; --high:#EF9455; --med:#E0BA4A; --low:#4FC391; --info:#7AA5F0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.015em;margin:0}
a{color:var(--brand)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  padding:20px 14px; display:flex; flex-direction:column; gap:6px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brandmark{display:flex;align-items:center;gap:9px;padding:0 8px 16px;margin-bottom:6px;border-bottom:1px solid var(--line-soft)}
.brandmark .glyph{
  width:26px;height:26px;border-radius:7px;background:var(--brand);
  display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;flex:none;
}
html[data-theme="dark"] .brandmark .glyph{color:#08161a}
.brandmark b{font-family:var(--display);font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.2}
.brandmark span{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.navlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 5px}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;color:var(--ink-2);font-size:14px;font-weight:500;
  transition:background .13s,color .13s;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--brand-wash);color:var(--brand-deep);font-weight:600}
html[data-theme="dark"] .navbtn[aria-current="true"]{color:var(--brand-deep)}
.navbtn .k{font-family:var(--mono);font-size:11px;color:var(--muted);width:13px;flex:none;text-align:center}
.navbtn[aria-current="true"] .k{color:var(--brand)}
.railfoot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:4px}
.minibtn{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);
  padding:6px 10px;border-radius:6px;text-align:left;width:100%;
}
.minibtn:hover{background:var(--surface-2);color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.view{padding:26px 34px 80px;max-width:1080px;width:100%;animation:rise .34s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- posture bar (signature) ---------- */
.posture{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);padding:12px 34px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.ring{width:52px;height:52px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .track{stroke:var(--line-soft)}
.ring .fill{stroke:var(--score);transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.3,1),stroke .4s}
.ring b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);
}
.posture-meta{min-width:150px}
.posture-meta .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.posture-meta .val{font-family:var(--display);font-size:17px;font-weight:600;color:var(--score);line-height:1.25}
.posture-stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.pstat .n{font-family:var(--mono);font-size:16px;font-weight:600}
.pstat .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- typography blocks ---------- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
.h-page{font-size:29px;line-height:1.15;letter-spacing:-.025em}
.sub{color:var(--muted);max-width:62ch;margin:9px 0 0;font-size:14.5px}
.divider{height:1px;background:var(--line);margin:26px 0}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}

.topic-card{padding:15px 16px;text-align:left;display:flex;flex-direction:column;gap:9px;transition:transform .14s,box-shadow .14s,border-color .14s;width:100%}
.topic-card:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 10px 26px -14px rgba(14,124,134,.5)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tc-num{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.tc-title{font-family:var(--display);font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.28}
.tc-blurb{font-size:13px;color:var(--muted);line-height:1.5}
.meter{height:4px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.tc-foot{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em}

/* priority pills use severity scale */
.pri{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;padding:3px 7px;border-radius:5px;white-space:nowrap;flex:none}
.pri-5{background:color-mix(in srgb,var(--crit) 13%,transparent);color:var(--crit)}
.pri-4{background:color-mix(in srgb,var(--high) 14%,transparent);color:var(--high)}
.pri-3{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;
  font-size:14px;font-weight:600;font-family:var(--body);
  background:var(--brand);color:#fff;transition:filter .14s,transform .1s;
}
html[data-theme="dark"] .btn{color:#06171a}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- library ---------- */
.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-bottom:9px}
.acc-head{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;text-align:left;cursor:pointer;list-style:none}
.acc-head::-webkit-details-marker{display:none}
.acc-head::marker{content:""}
.acc-head:hover{background:var(--surface-2)}
.acc-head .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none}
.acc-head .nm{font-family:var(--display);font-size:15px;font-weight:600;flex:1;letter-spacing:-.01em}
.acc-head .chev{color:var(--muted);transition:transform .2s;font-size:12px;font-family:var(--mono)}
.acc[open] .chev{transform:rotate(90deg)}
.acc-body{padding:2px 15px 18px 47px;border-top:1px solid var(--line-soft)}
.lede{font-size:14.5px;color:var(--ink-2);margin:14px 0 0}
.onjob{
  margin:14px 0 0;padding:11px 13px;background:var(--brand-wash);
  border-left:2px solid var(--brand);border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink-2);
}
.onjob b{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--brand-deep);display:block;margin-bottom:4px}
.mini-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
ul.pts{margin:0;padding-left:17px}
ul.pts li{margin-bottom:6px;font-size:14px;color:var(--ink-2)}
.termgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.term{padding:9px 11px;background:var(--surface-2);border-radius:7px;font-size:13.2px;border:1px solid var(--line-soft)}
.term b{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);display:block}
.term span{color:var(--muted)}

/* ---------- drill / practice ---------- */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 28px}
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.qcount{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--display);font-size:22px;line-height:1.32;letter-spacing:-.02em;margin:6px 0 0}
.answer{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line);animation:rise .28s ease}
.answer .mini-h{margin-top:0}
.selfrate{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.rate{padding:9px 15px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;font-weight:600;font-family:var(--body);transition:.14s}
.rate[data-v="0"]:hover{border-color:var(--crit);color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,transparent)}
.rate[data-v="1"]:hover{border-color:var(--med);color:var(--med);background:color-mix(in srgb,var(--med) 10%,transparent)}
.rate[data-v="2"]:hover{border-color:var(--low);color:var(--low);background:color-mix(in srgb,var(--low) 9%,transparent)}
.progline{height:3px;background:var(--line-soft);border-radius:99px;margin-bottom:20px;overflow:hidden}
.progline i{display:block;height:100%;background:var(--brand);transition:width .4s}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}
.chip{
  font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);color:var(--ink-2);transition:.13s;font-family:var(--body);
}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-theme="dark"] .chip[aria-pressed="true"]{color:#06171a}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-soft)}
.tag.scenario{color:var(--high);border-color:color-mix(in srgb,var(--high) 30%,transparent)}
.tag.deep{color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.tag.behavioral{color:var(--low);border-color:color-mix(in srgb,var(--low) 30%,transparent)}

/* ---------- flashcard ---------- */
.flip{perspective:1400px;height:250px;margin:0 auto;max-width:560px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center;gap:10px;
}
.face.back{transform:rotateY(180deg);background:var(--surface-2)}
.face .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.face .t{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-.02em}
.face .d{font-size:15px;color:var(--ink-2);max-width:44ch;line-height:1.55}

/* ---------- tables / plan ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.8px}
.tbl th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);
}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl code{font-family:var(--mono);font-size:12.4px;color:var(--brand-deep);font-weight:500}
.search{
  width:100%;padding:10px 13px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:var(--body);font-size:14px;
}
.search:focus{outline:2px solid var(--brand);outline-offset:1px}
.week{padding:16px 18px}
.week h4{font-size:16px;margin-bottom:2px}
.week .wlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:9px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13.8px;color:var(--ink-2);cursor:pointer}
.task input{margin-top:4px;accent-color:var(--brand);flex:none;width:15px;height:15px;cursor:pointer}
.task.done span{text-decoration:line-through;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:12.6px;color:var(--muted);margin-top:10px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;gap:4px;padding:10px;border-right:none;border-bottom:1px solid var(--line);align-items:center}
  .brandmark{border:none;padding:0 10px 0 4px;margin:0;flex:none}
  .brandmark .txt{display:none}
  .navlabel{display:none}
  .navbtn{width:auto;white-space:nowrap;padding:7px 11px}
  .navbtn .k{display:none}
  .railfoot{margin:0 0 0 auto;flex-direction:row;border:none;padding:0}
  .minibtn{width:auto}
  .view{padding:20px 16px 70px}
  .posture{padding:11px 16px;gap:12px}
  .stage{padding:19px 17px}
  .qtext{font-size:19px}
  .acc-body{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail">
    <div class="brandmark">
      <div class="glyph">S2</div>
      <div class="txt"><b>Readiness Console</b><span>Humana · CSE2</span></div>
    </div>
    <div class="navlabel">Prepare</div>
    <button class="navbtn" data-view="overview"><span class="k">01</span>Overview</button>
    <button class="navbtn" data-view="library"><span class="k">02</span>Topic library</button>
    <button class="navbtn" data-view="drill"><span class="k">03</span>Guided study</button>
    <div class="navlabel">Rehearse</div>
    <button class="navbtn" data-view="interview"><span class="k">04</span>Interview practice</button>
    <button class="navbtn" data-view="cards"><span class="k">05</span>Flashcards</button>
    <div class="navlabel">Reference</div>
    <button class="navbtn" data-view="tools"><span class="k">06</span>Tool directory</button>
    <button class="navbtn" data-view="acronyms"><span class="k">07</span>Acronym decoder</button>
    <button class="navbtn" data-view="plan"><span class="k">08</span>3-week plan</button>
    <div class="railfoot">
      <button class="minibtn" id="themeBtn">◐ Theme</button>
      <button class="minibtn" id="exportBtn">↓ Save progress</button>
      <button class="minibtn" id="resetBtn">⟲ Reset progress</button>
    </div>
  </nav>
  <div class="main">
    <header class="posture" id="posture"></header>
    <div id="view" class="view"></div>
  </div>
</div>
<script>
/* ============================================================
   CONTENT — tuned to the Humana Cyber Security Engineer 2 posting
   (Product Security Tools team)
   ============================================================ */

const ROLE = {
  title:"Cyber Security Engineer 2 · Product Security Tools",
  org:"Humana · Remote",
  thesis:"This is a tool operations role, not a tool architecture role. The team owns the security platforms — onboarding them, integrating them, tuning them, fixing them when they break, and reporting on what they find. Most interview questions will be some version of \u201Chow would you make this tool work well for the people who depend on it.\u201D",
  signals:[
    {k:"Named platforms",v:"AppOmni, Cycode, Checkmarx, Wiz, Prisma Cloud, JFrog/Xray, AppScan, Burp Suite, NowSecure, GCP Model Armor. Know what each one is and what category it belongs to."},
    {k:"Named integrations",v:"Splunk, ServiceNow, Azure DevOps, GitHub, M365. Integration is listed as a duty, not a nice-to-have."},
    {k:"AI security",v:"Model Armor, AI application discovery, AI posture management. Mentioned twice. Almost nobody preparing for this role will have studied it."},
    {k:"Three clouds",v:"Azure, GCP, and AWS all named. GCP matters more here than a typical Azure-shop posting."},
    {k:"Regulated environment",v:"Humana is healthcare. Audit, compliance, change management, and access reviews are called out explicitly."},
    {k:"Operational output",v:"Reports, dashboards, metrics, executive summaries, SOPs, playbooks, KT docs, escalation paths, QBRs. Roughly half the listed duties are communication artifacts."}
  ]
};

const TOPICS = [
{
  id:"toolops", n:1, title:"Security Tool Operations", pri:5,
  blurb:"Onboarding, tuning, and keeping the platforms healthy. This is the job.",
  lede:"Read the posting's verb list: onboard, configure, tune, operationalize, troubleshoot, maintain. The team doesn't primarily hunt threats — it makes the tools that hunt threats actually work. A tool that's deployed but noisy, half-covered, or quietly broken provides no security value, and closing that gap is the whole role.",
  onjob:"You own a platform end to end: getting it connected to the environment, tuning it until the findings are trustworthy, fixing the scan that started failing on Tuesday, and being able to say what percentage of the estate it actually covers.",
  points:[
    "Onboarding is a project: scope, connect, authenticate, validate coverage, baseline the findings, then tune before anyone else sees results.",
    "\u201COperationalized\u201D means someone acts on the output. Deployed and operationalized are completely different states, and interviewers listen for whether you know that.",
    "Tuning is continuous. Every rule change, every new repo, every cloud account shifts the noise floor.",
    "Tool health is its own monitoring problem: are scans completing, are connectors authenticated, is coverage drifting, are results stale.",
    "Troubleshooting patterns: expired credentials or tokens, permission changes on the service account, API rate limits, network/proxy blocks, agent version drift, timeouts on large repos.",
    "Coverage is the metric that matters most and is reported least. \u201C400 findings\u201D means nothing without \u201Cacross 60% of repos.\u201D",
    "Every tool needs an owner, a runbook, an escalation path, and a vendor contact — before it breaks, not during."
  ],
  terms:[
    {t:"Onboarding",d:"Connecting a tool to systems and validating it sees what it should."},
    {t:"Operationalize",d:"Getting output into a workflow where someone acts on it."},
    {t:"Tuning",d:"Adjusting rules and thresholds so findings are trustworthy and actionable."},
    {t:"Coverage",d:"Percentage of the estate a tool actually sees — the most under-reported metric."},
    {t:"Tool health",d:"Whether scans, connectors, and integrations are functioning right now."},
    {t:"Baseline",d:"The initial finding set, separated from new findings so new code is held clean."},
    {t:"Runbook / SOP",d:"Documented procedure for a recurring operational task."},
    {t:"Escalation path",d:"Defined route for an issue that can't be resolved at the current level."}
  ],
  study:[
    {q:"What's the difference between a tool being deployed and being operationalized?",a:"Deployed means it's installed and producing output. Operationalized means the output reaches the right person in the workflow they already use, they trust it enough to act, and there's a defined process for what happens next. Most failed tool rollouts are deployed but never operationalized."},
    {q:"You onboard a new scanner and it returns 3,000 findings on day one. What do you do before telling anyone?",a:"Baseline them. Separate the pre-existing debt from anything new so teams are held to a clean standard going forward without being handed 3,000 tickets. Then sample the findings to estimate the false positive rate and tune before the first real report."},
    {q:"Name five reasons a scan that worked yesterday fails today.",a:"Expired credential or rotated token, changed permissions on the service account, API rate limiting, a network or proxy change blocking the connector, agent or extension version drift, repo grew past a size or timeout limit, or an upstream vendor outage."},
    {q:"Why is coverage more important than finding count?",a:"Finding count without coverage is unmeasurable. Zero findings could mean a clean environment or a scanner pointed at nothing. Coverage tells you how much of the estate the number actually describes, and coverage gaps are invisible risk."}

{
  id:"integrations", n:3, title:"Integrations — Splunk, ServiceNow, ADO, GitHub, M365", pri:5,

    {q:"What breaks most often in a findings-to-ticketing integration?",a:"Duplicates and stale state. The same finding rescanned creates repeat tickets, or the finding is fixed but the ticket stays open because closure doesn't sync back. Both destroy trust quickly. You need a stable finding identifier and bidirectional status sync."},

{

  lede:"The posting mentions AI security twice: GCP Model Armor as a named platform, and \u201CAI security controls, Model Armor, AI application discovery, or AI posture management\u201D in the experience list. This is the newest part of the role and the one where a candidate can most easily stand out, because most applicants will have nothing to say here.",

  points:[
    "<b>Model Armor</b> is a GCP service that screens prompts and model responses at runtime — checking for prompt injection, jailbreak attempts, sensitive data leakage, malicious URLs, and harmful content. Think of it as a WAF for the model boundary.",
    "<b>Prompt injection</b> is the defining AI vulnerability: untrusted input is interpreted as instruction. Direct injection comes from the user; indirect injection hides in content the model retrieves, like a document or a web page.",

    {q:"What does Model Armor do?",a:"It screens prompts going into a model and responses coming back, at runtime. It checks for prompt injection and jailbreak attempts, sensitive data in either direction, malicious URLs, and harmful content, and it can block or flag based on policy. It's a guardrail at the model boundary, conceptually like a WAF."},
    {q:"Explain prompt injection and why it's hard to fix.",a:"The model receives instructions and data in the same channel — plain text — so anything that looks like an instruction can be treated as one. Unlike SQL injection there's no parameterization to separate them, because natural language has no strict grammar to enforce. So mitigation is layered: input and output screening, least privilege on what the model can do, and never trusting output as safe."},
    {q:"What's indirect prompt injection?",a:"The malicious instruction isn't typed by the user — it's embedded in content the model retrieves, such as a web page, PDF, or support ticket. The user asks an innocent question, the model reads the poisoned document, and follows the attacker's instructions. It's the main risk in RAG systems."},
    {q:"What is AI application discovery and why does it matter here?",a:"Finding AI applications and integrations teams have deployed without security review — shadow AI. It matters because you can't apply guardrails, posture checks, or data controls to systems you don't know exist, and LLM integrations are trivially easy for a developer to stand up with an API key."},
    {q:"Why is excessive agency a serious risk?",a:"When an AI system is given tools — calling APIs, querying databases, sending email — its permissions become its blast radius. If it can be manipulated through injection, it acts with whatever access it holds. The mitigation is standard least privilege plus human approval on consequential actions."}

{
  id:"appsec", n:5, title:"AppSec Scanning — SAST, DAST, SCA, Mobile", pri:5,
  blurb:"Checkmarx, AppScan, Burp, JFrog Xray, NowSecure — what each class catches.",
  lede:"Most of the named platforms are application security scanners. Know what each class sees, what it's blind to, and where it belongs in the lifecycle. Every one of them has a characteristic false-positive problem, and managing that is most of the operational work.",
  onjob:"Onboarding repos to Checkmarx, running authenticated AppScan configurations, triaging Xray dependency findings, and tuning all of it so developers keep paying attention.",
  points:[
    "<b>SAST (Checkmarx)</b> — reads source without running it. Catches injection, unsafe deserialization, bad crypto. Runs early. High false positives because it lacks runtime context.",
    "<b>DAST (AppScan, Burp)</b> — attacks a running application from outside. Catches auth flaws, misconfigured headers, exposed endpoints. Few false positives, but needs a deployed environment and finds issues late. Authenticated scan configuration is the fiddly part.",
    "<b>SCA (JFrog Xray)</b> — inventories dependencies and matches them to known CVEs, plus license risk. Usually the largest source of real vulnerabilities, because most of an app is third-party code.",
    "<b>Mobile (NowSecure)</b> — mobile-specific risks: insecure local storage, weak transport, hardcoded keys in the binary, tampering and reverse-engineering exposure.",
    "<b>Secrets (Cycode)</b> — credentials in code and history. Covered in its own topic because the posting calls it out separately.",
    "Reachability analysis is the modern answer to SCA noise: is the vulnerable function actually called by your code? It routinely cuts actionable findings by most of the list.",
    "Triage discipline matters more than scanner selection. A tuned scanner with an owned queue beats a better scanner nobody reads."
  ],
  terms:[
    {t:"SAST",d:"Static analysis of source code without executing it."},
    {t:"DAST",d:"Dynamic testing against a running application."},
    {t:"SCA",d:"Software Composition Analysis — vulnerable open-source dependencies."},
    {t:"Authenticated scan",d:"A DAST scan configured with credentials so it can test past the login."},
    {t:"Reachability",d:"Whether your code actually invokes the vulnerable dependency path."},
    {t:"SBOM",d:"Software Bill of Materials — manifest of every component in a build."},
    {t:"Transitive dependency",d:"A dependency of your dependency, which you never chose directly."},
    {t:"Triage",d:"Validating and prioritizing findings before sending them to owners."}
  ],
  study:[
    {q:"SAST vs DAST in one line each.",a:"SAST reads source code without running it — early, broad, more false positives. DAST attacks the running application from outside — later, fewer findings, but higher confidence because it demonstrated the behavior."},
    {q:"Why is SCA usually the biggest source of real vulnerabilities?",a:"Most of a modern application is imported code. Your team wrote a small fraction of what ships, every dependency brings transitive dependencies, and nobody reviews them. The volume is high and the fixes are often just a version bump."},
    {q:"What makes DAST operationally harder than SAST?",a:"It needs a running, reachable environment and usually authenticated access, so scan configuration involves credentials, session handling, and crawl scope. It can also generate load or create test data in the target, so scheduling and environment choice matter."},
    {q:"How would you reduce SCA noise without ignoring real risk?",a:"Prioritize by reachability first — is the vulnerable function actually invoked. Then layer exposure: is the service internet-facing. Then look for batch fixes where one base image or framework upgrade closes many findings at once. Report on reachable-and-exposed rather than total count."}

{
  id:"secrets", n:6, title:"Secrets Detection & SaaS Posture", pri:5,
  blurb:"Cycode and AppOmni — two duties the posting calls out by name.",
  lede:"The posting gives secrets detection and SaaS posture their own bullets, which means they're active workstreams, not background capability. Both are about a category of exposure that lives outside the traditional application boundary: credentials in code, and configuration in SaaS platforms nobody thinks of as infrastructure.",
  onjob:"Running the Cycode secrets program — detection, remediation tracking, root cause, preventive controls — and expanding AppOmni coverage across the SaaS estate, including AI application discovery.",
  points:[
    "A committed secret is not fixed by deleting the line. It persists in Git history, in every clone and fork, and in CI logs. <b>Rotation is the remediation.</b> Everything else is cleanup.",

    "Prevention layers: pre-commit hooks catch it on the developer's machine, server-side push protection catches it at the repo, and a secrets manager removes the need to have one in code at all.",

    "<b>SSPM (AppOmni)</b> applies posture management to SaaS: external sharing, guest and stale accounts, OAuth app grants, admin role sprawl, MFA enforcement, data exposure settings.",

    "SaaS is where AI application discovery often happens too, since most shadow AI arrives as a SaaS integration or an OAuth-connected app.",

  ],
  terms:[
    {t:"Secrets scanning",d:"Detecting credentials, keys, and tokens in code, history, and logs."},
    {t:"Rotation",d:"Replacing a credential so an exposed one becomes worthless — the actual fix."},
    {t:"Push protection",d:"Server-side blocking of a push containing a detected secret."},
    {t:"Pre-commit hook",d:"A local check that stops a secret before it becomes a commit."},
    {t:"SSPM",d:"SaaS Security Posture Management — misconfiguration detection for SaaS apps."},

  study:[
    {q:"A secret was committed and removed in the next commit. What's the remediation?",a:"Rotate the credential immediately. The secret is still in Git history and in every clone, fork, and CI log that touched it. Removing the line changes nothing about exposure. Rotation invalidates it; history purging is optional cleanup afterward."},
    {q:"What preventive controls stop secrets reaching the repo?",a:"Pre-commit hooks on developer machines, server-side push protection at the repository, a secrets manager or vault so there's no credential to hardcode, short-lived tokens and workload identity federation so there's nothing long-lived to leak, and developer education on the pattern."},
    {q:"What does SSPM look for that CSPM doesn't?",a:"SaaS-specific configuration: external and public sharing, guest accounts, OAuth app grants, admin role assignments, MFA enforcement, data loss settings, and integration permissions. CSPM looks at cloud infrastructure you provision; SSPM looks at platforms you subscribe to."},
    {q:"Why are OAuth grants a significant SaaS risk?",a:"A third-party app granted broad delegated permissions can read or act on organizational data indefinitely, often approved by a single user, and it's rarely reviewed afterward. If that vendor is compromised, the grant is a standing path into your data."}

const MEM = {};
const store = {
  read(){
    try{ const r = localStorage.getItem("secprep.v1"); if(r) return JSON.parse(r); }catch(e){}
    return MEM.data || null;
  },
  write(o){
    MEM.data = o;
    try{ localStorage.setItem("secprep.v1", JSON.stringify(o)); }catch(e){}
  },
  clear(){ MEM.data = null; try{ localStorage.removeItem("secprep.v1"); }catch(e){} }
};
const blank = () => ({read:{}, study:{}, iq:{}, cards:{}, plan:{}, theme:"light"});
let S = Object.assign(blank(), store.read() || {});
const save = () => store.write(S);

const T = id => TOPICS.find(t=>t.id===id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* readiness maths */
function topicScore(t){
  const sq = t.study.length, iqn = t.iq.length;
  const sDone = t.study.filter((_,i)=>S.study[t.id+":"+i]!=null).length;
  const sGood = t.study.filter((_,i)=>(S.study[t.id+":"+i]||0)>=2).length;
  const iDone = t.iq.filter((_,i)=>S.iq[t.id+":"+i]!=null).length;
  const iGood = t.iq.filter((_,i)=>(S.iq[t.id+":"+i]||0)>=2).length;
  const readPart = S.read[t.id] ? 25 : 0;
  const studyPart = sq ? 40*(sGood/sq) : 40;
  const iqPart = iqn ? 35*(iGood/iqn) : 35;
  return {
    pct: Math.round(readPart+studyPart+iqPart),
    sDone, sq, iDone, iqn, sGood, iGood,
    touched: !!S.read[t.id] || sDone>0 || iDone>0
  };
}
function readiness(){
  let wsum=0, w=0;
  TOPICS.forEach(t=>{ const wt = t.pri; wsum += topicScore(t).pct*wt; w += wt; });
  return Math.round(wsum/w);
}
const BANDS = [
  {min:0,  label:"Not started",     v:"--crit"},
  {min:1,  label:"Critical gaps",   v:"--crit"},
  {min:25, label:"Major gaps",      v:"--high"},
  {min:45, label:"Coming together", v:"--med"},
  {min:65, label:"Solid coverage",  v:"--low"},
  {min:85, label:"Interview-ready", v:"--brand"}
];
const band = p => BANDS.filter(b=>p>=b.min).pop();

      <svg width="52" height="52"><circle class="track" cx="26" cy="26" r="23"></circle>
      <circle class="fill" cx="26" cy="26" r="23" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"></circle></svg>
      <b>${p}</b>
    </div>

      <div class="pstat"><div class="n" style="color:${weak?"var(--crit)":"var(--low)"}">${weak}</div><div class="t">Top-priority gaps</div></div>
    </div>`;
}

let view = "overview";
function render(){
  document.querySelectorAll(".navbtn").forEach(b=>b.setAttribute("aria-current", b.dataset.view===view));
  document.getElementById("view").innerHTML = V[view]();
  renderPosture();
  const q = document.getElementById("q");
  if(q){ q.addEventListener("input", e=>{ filter=e.target.value; const p=e.target.selectionStart;
    render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(p,p); }); }
  const fl = document.getElementById("flip");
  if(fl) fl.addEventListener("click", ()=>{ deck.flipped=!deck.flipped; render(); });
}
function go(v){
  // a finished session shouldn't greet you again when you come back to the tab
  if(v!=="drill" && drill && drill.stage==="done") drill=null;
  if(v!=="interview" && sess && sess.stage==="done") sess=null;
  if(v!=="cards" && deck && deck.i>=deck.list.length) deck=null;
  view=v; window.scrollTo({top:0,behavior:"instant"}); render();
}

function startDrill(id){ drill={id, stage:"intro", i:0, shown:false, good:0}; go("drill"); }
function startPractice(ids, count, beh, mock){
  let pool=[];
  const list = ids && ids.length ? ids : TOPICS.map(t=>t.id);
  list.forEach(id=>{ const t=T(id); t.iq.forEach((q,i)=>pool.push({...q, topic:t.title, key:id+":"+i})); });
  if(mock){
    const five = pool.filter(q=>TOPICS.find(t=>t.title===q.topic).pri===5 && q.lvl!=="behavioral");
    const rest = pool.filter(q=>!five.includes(q) && q.lvl!=="behavioral");
    pool = shuffle(five).slice(0,5).concat(shuffle(rest).slice(0,2));
    pool = pool.concat(shuffle(BEHAVIORAL_EXTRA.concat(T("traits").iq.map((q,i)=>({...q,topic:"Behavioral",key:"traits:"+i})))).slice(0,3));
  } else {
    if(!beh) pool = pool.filter(q=>q.lvl!=="behavioral");
    pool = shuffle(pool);
    if(count>0) pool = pool.slice(0,count);
  }
  sess={qs:pool, i:0, shown:false, rated:[], weak:[], mock:!!mock, stage:"run"};
  go("interview");
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildDeck(kind){
  let rows=[];
  TOPICS.forEach(t=>{ if(kind==="p5"&&t.pri!==5) return; t.terms.forEach((x,i)=>rows.push({...x,topic:t.title,key:t.id+":"+i})); });
  if(kind==="unknown") rows = rows.filter(r=>!S.cards[r.key]);
  deck={list:shuffle(rows), i:0, flipped:false, known:0};
  if(!deck.list.length) deck.list=[{t:"Nothing left",d:"Every card in this deck is already marked known. Pick another deck.",topic:"—",key:"x"}];
  go("cards");
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-view],[data-view-go],[data-goto],[data-read],[data-drill],[data-drill-start],[data-drill-show],[data-drill-exit],[data-rate],[data-pick],[data-count],[data-beh],[data-sess],[data-sess-show],[data-sess-exit],[data-srate],[data-practice],[data-deck],[data-deck-exit],[data-card]");
  if(!el) return;
  const d = el.dataset;

  if(d.view){ go(d.view); return; }
  if(d.viewGo){ go(d.viewGo); return; }
  if(d.goto){ go("library"); setTimeout(()=>{ const a=document.getElementById("acc-"+d.goto); if(a){a.open=true; a.scrollIntoView({behavior:"smooth",block:"start"});} },60); return; }
  if(d.read){ S.read[d.read]=!S.read[d.read]; save(); render(); return; }

  if(d.drill){ startDrill(d.drill); return; }
  if(d.drillStart){ drill.stage="run"; drill.i=0; drill.shown=false; drill.good=0; S.read[drill.id]=true; save(); render(); return; }
  if(d.drillShow){ drill.shown=true; render(); return; }
  if(d.drillExit){ drill=null; render(); return; }
  if(d.rate!=null && drill){
    const v=+d.rate, t=T(drill.id);
    S.study[drill.id+":"+drill.i]=v; if(v===2) drill.good++;
    save();
    drill.i++; drill.shown=false;
    if(drill.i>=t.study.length) drill.stage="done";
    render(); return;
  }

  if(d.pick){ pick.topics.has(d.pick)?pick.topics.delete(d.pick):pick.topics.add(d.pick); render(); return; }
  if(d.count!=null){ pick.count=+d.count; render(); return; }
  if(d.beh){ pick.behavioral=!pick.behavioral; render(); return; }
  if(d.sess){ d.sess==="mock"?startPractice(null,0,true,true):startPractice([...pick.topics], pick.count, pick.behavioral, false); return; }
  if(d.practice){ startPractice([d.practice],0,true,false); return; }
  if(d.sessShow){ sess.shown=true; render(); return; }
  if(d.sessExit){ sess=null; render(); return; }
  if(d.srate!=null && sess){
    const v=+d.srate, q=sess.qs[sess.i];
    sess.rated.push(v); if(v<2) sess.weak.push(q.q);
    if(q.key) S.iq[q.key]=v;
    save();
    sess.i++; sess.shown=false;
    if(sess.i>=sess.qs.length) sess.stage="done";
    render(); return;
  }

  if(d.deck){ buildDeck(d.deck); return; }
  if(d.deckExit){ deck=null; render(); return; }
  if(d.card!=null){
    const c=deck.list[deck.i];
    if(d.card==="1"){ S.cards[c.key]=true; deck.known++; save(); }
    deck.i++; deck.flipped=false; render(); return;
  }
});

document.addEventListener("change", e=>{
  if(e.target.dataset.plan!=null){ S.plan[e.target.dataset.plan]=e.target.checked; save(); render(); }
});

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(view==="drill" && drill && drill.stage==="run"){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!drill.shown){drill.shown=true;render();} }
    if(drill.shown && ["1","2","3"].includes(e.key)) document.querySelector(`[data-rate="${+e.key-1}"]`)?.click();
  }
  if(view==="interview" && sess && sess.stage==="run"){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!sess.shown){sess.shown=true;render();} }
    if(sess.shown && ["1","2","3"].includes(e.key)) document.querySelector(`[data-srate="${+e.key-1}"]`)?.click();
  }
  if(view==="cards" && deck && deck.i<deck.list.length && (e.key===" "||e.key==="Enter")){ e.preventDefault(); deck.flipped=!deck.flipped; render(); }
});

/* theme + progress controls */
function applyTheme(){ document.documentElement.setAttribute("data-theme", S.theme||"light"); }
document.getElementById("themeBtn").addEventListener("click", ()=>{ S.theme = S.theme==="dark"?"light":"dark"; save(); applyTheme(); });
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Clear all progress? Ratings, read marks, flashcards and plan checkboxes will be reset.")) return;
  const th=S.theme; store.clear(); S=Object.assign(blank(),{theme:th}); save(); drill=null; sess=null; deck=null; go("overview");
});
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "secprep-progress.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});

applyTheme();
render();
</script>
</body>
</html>
